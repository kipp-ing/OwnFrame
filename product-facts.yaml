# OwnFrame — what the app does and does not do.
# Authority: Jan's decisions > current specs. Code is only the check (implementation:).
# verdict:        does | does_not | partial | deferred | planned
# implementation: verified (build matches the fact) | mismatch (build differs from intent) |
#                 unverified (not confirmed in code, or needs a device) | n/a (nothing to build)
# evidence paths are repo-relative; ":n" suffixes are line numbers at commit 7867732.
schema: 1
updated: 2026-09-16
verified_commit: 404ae81
purpose: "OwnFrame turns an iPad or iPhone you already own into a digital photo frame that is easy to set up, needs no fiddling, and picks up new photos from an album on its own. The whole core frame is free; one optional one-time purchase adds extras."
audience:
  - "People looking for a digital photo frame who have a spare iPad or iPhone (for example an old one in a drawer)"
  - "People whose photos live in Apple Photos / iCloud, with no server of their own (expected to be the majority)"
  - "Immich users who want an Immich album or an Immich link on a frame"
  - "Families who set up a frame for someone else (a grandparent, say) and keep it fed from a shared album"
  - "Home Assistant users who want to see and control the frame from their smart home"
not_for:
  - "Anyone who needs the screen to switch off, sleep or wake on its own schedule"
  - "Anyone who wants the slideshow to keep running while another app is in front, or in the background"
  - "Video, or Live Photos with motion"
  - "Photos stored in Google Photos, Dropbox, OneDrive, Nextcloud, a NAS share or local files"
  - "Showing a whole photo library, people, places or memories rather than an album"
  - "Devices that cannot run iOS / iPadOS 17"
  - "Immich servers older than v3, or servers with self-signed certificates or plain HTTP"
principles:
  - id: P-01
    principle: "OwnFrame only shows photos. It never adds, uploads, removes, edits or reorders photos, and never creates or changes albums. Album content is managed in Immich or Apple Photos, outside the app."
    facts: [SRC-19]
    intent: ["decision 2026-09-13", "FR-900-03"]
  - id: P-02
    principle: "Easy setup, no fiddling, and new photos that arrive on their own are why the app exists."
    facts: [SRC-01, PLAY-02, UNATT-05]
    intent: ["J-01"]
  - id: P-03
    principle: "The free app is the complete frame, and nothing that was free is ever moved behind a purchase."
    facts: [PAY-01, PAY-09]
    intent: ["J-11", "FR-1100-01", "FR-1100-13"]
  - id: P-04
    principle: "Paid extras are one optional one-time purchase; never a subscription."
    facts: [PAY-02, PAY-03]
    intent: ["J-10", "J-12", "FR-1100-05"]
  - id: P-05
    principle: "Secrets live only in the keychain, TLS is never disabled, no data is collected, and there is no extra cloud between the photos and the frame."
    facts: [PRIV-01, PRIV-03, PRIV-04, PRIV-06]
    intent: ["J-18", "J-35"]
  - id: P-06
    principle: "Calm by default: the photo comes first and effects are opt-in."
    facts: [LOOK-01]
    intent: ["J-29"]
